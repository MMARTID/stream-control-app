name: Build de Windows

# Compila y prueba la app en Windows y deja el .exe portable y el instalador como artefactos
# descargables. Se lanza a mano (Actions → «Build de Windows» → Run workflow) o al subir una etiqueta v*;
# con una etiqueta (p. ej. v0.2.0) además publica una Release de GitHub con los dos archivos.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # solo lo usa el paso de la Release; el resto del flujo no escribe en el repositorio

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias de la interfaz
        run: npm ci

      - name: Pruebas del seguimiento (funciones puras)
        run: npm test

      # Pruebas contra el OBS simulado (cliente, núcleo, capturas, panel web con HTTPS real y avatar).
      - name: Pruebas de Rust
        working-directory: src-tauri
        run: cargo test

      # Almacén seguro REAL (Credential Manager). No bloquea el build: informa de si funciona.
      - name: Prueba del Credential Manager de Windows
        working-directory: src-tauri
        continue-on-error: true
        run: cargo test keyring_real -- --ignored

      - name: Compilar la app (portable e instalador NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Preparar los archivos de la versión
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item src-tauri/target/release/stream-control.exe "release/Stream-Control_${v}_portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Get-ChildItem release | Format-Table Name, Length

      - name: Subir los archivos como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: stream-control-windows
          path: release/*
          if-no-files-found: error

      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
