<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Control</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <strong>Stream Control</strong>
        <small id="version"></small>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones">
        <button role="tab" data-tab="live"><span aria-hidden="true">🎬</span> Directo</button>
        <button role="tab" data-tab="avatar"><span aria-hidden="true">🎭</span> Avatar</button>
        <button role="tab" data-tab="lights"><span aria-hidden="true">💡</span> Luces</button>
        <button role="tab" data-tab="mobile"><span aria-hidden="true">📱</span> Móvil</button>
        <button role="tab" data-tab="settings"><span aria-hidden="true">⚙️</span> Ajustes</button>
      </nav>
      <div class="spacer"></div>
      <div id="connection" class="pill" role="status"></div>
      <div id="stream-control"></div>
    </header>

    <div id="toast" class="toast" role="alert" hidden></div>
    <div id="pairing" class="pairing" role="status" hidden></div>

    <main id="view-live" class="view"></main>
    <main id="view-avatar" class="view" hidden></main>
    <main id="view-lights" class="view" hidden></main>
    <main id="view-mobile" class="view" hidden></main>
    <main id="view-settings" class="view" hidden></main>
  </body>
</html>
