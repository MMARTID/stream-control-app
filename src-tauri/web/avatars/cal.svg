<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Avatar Cal">
  <!--
    Personaje de Stream Control. Convenciones para sustituirlo por otro dibujo (lienzo 400×440):
    #avatar-body (balanceo), #avatar-head (giro/inclinación, eje en 200,300), #avatar-face (rasgos;
    se desplaza al girar), #eye-l/#eye-r (parpadeo; data-cx/data-cy y contenido en coordenadas
    locales centradas en 0,0), #pupil-l/#pupil-r (mirada), #brow-l/#brow-r, y la boca (centro
    200,250, la dibuja avatar.js): #mouth-lips y #mouth-shade (opcionales), #mouth-cavity,
    #mouth-clip-path, #mouth-line, #mouth-teeth, #mouth-tongue. Opcional: #avatar-jaw (barbilla
    y barba; se estira hacia abajo al abrir la boca desde data-pivot hasta data-chin).
    Dibujo propio, inspirado en el aspecto de personajes de GTA VI. No es arte oficial de
    Rockstar Games ni de Take-Two.
  -->
