<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Avatar Cal">
  <!--
    Personaje de Stream Control. Convenciones para sustituirlo por otro dibujo (lienzo 400×440):
    #avatar-body (balanceo), #avatar-head (giro/inclinación, eje en 200,300), #avatar-face (rasgos),
    #eye-l/#eye-r (parpadeo, con data-cx/data-cy), #pupil-l/#pupil-r, #brow-l/#brow-r, y la boca
    (centro 200,250): #mouth-lips (opcional), #mouth-cavity, #mouth-clip-path, #mouth-line,
    #mouth-teeth, #mouth-tongue.
    Dibujo propio en estilo de caricatura realista, inspirado en el aspecto de personajes de GTA VI.
    No es arte oficial de Rockstar Games ni de Take-Two.
  -->
  <defs>
    <clipPath id="mouth-clip"><path id="mouth-clip-path" d="M 164 247.75 Q 200 255.75 236 247.75 Q 200 255.75 164 247.75 Z"/></clipPath>
    <clipPath id="face-clip"><path d="M 100 168 C 100 98, 146 64, 200 64 C 254 64, 300 98, 300 168 C 300 236, 262 294, 200 296 C 138 294, 100 236, 100 168 Z"/></clipPath>
    <radialGradient id="skin" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#f0c6a0"/><stop offset=".6" stop-color="#e2b088"/><stop offset="1" stop-color="#bd8860"/></radialGradient>
  </defs>
  <g id="avatar-body">
    <path d="M 6 440 C 8 366, 86 314, 200 314 C 314 314, 392 366, 394 440 Z" fill="#e2b088" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
    <g opacity=".9" stroke="#2b3b52" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 352 392 q 12 -16 24 0 q -12 16 -24 0 Z" stroke-width="4"/><path d="M 364 380 v 40 M 354 408 q 10 12 20 0" stroke-width="4"/>
      <path d="M 340 424 q 8 -6 16 0 t 16 0 t 16 0" stroke-width="4"/>
      <path d="M 372 358 l 6 10 l 11 1 l -8 8 l 2 11 l -10 -6 l -10 6 l 2 -11 l -8 -8 l 11 -1 Z" stroke-width="3"/>
    </g>
    <path d="M 52 440 C 48 390, 70 346, 132 328 L 162 322 Q 200 346 238 322 L 268 328 C 330 346, 352 390, 348 440 Z" fill="#3b4048" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 164 326 Q 200 352 236 326" fill="none" stroke="#2a2e34" stroke-width="6" stroke-linecap="round"/>
    <path d="M 70 420 Q 74 386 104 362 M 330 420 Q 326 386 296 362" fill="none" stroke="#4d535c" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <g id="avatar-head" transform="rotate(0 200 300)">
      <path d="M 150 266 L 140 326 Q 200 358 260 326 L 250 266 Z" fill="#bd8860" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="102" cy="194" rx="12" ry="22" fill="#e2b088" stroke="#1a0f0a" stroke-width="3.5"/>
      <ellipse cx="298" cy="194" rx="12" ry="22" fill="#e2b088" stroke="#1a0f0a" stroke-width="3.5"/>
      <path d="M 106 120 L 100 176 L 116 170 L 120 124 Z M 294 120 L 300 176 L 284 170 L 280 124 Z" fill="#6b4a2f" stroke="#1a0f0a" stroke-width="3" stroke-linejoin="round"/>
      <path id="face-shape" d="M 100 168 C 100 98, 146 64, 200 64 C 254 64, 300 98, 300 168 C 300 236, 262 294, 200 296 C 138 294, 100 236, 100 168 Z" fill="url(#skin)" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
      <g id="avatar-face">
        <path d="M 104 172 C 106 236, 140 282, 188 298 C 148 276, 122 236, 118 172 Z" fill="#bd8860" opacity=".4"/>
        <ellipse cx="136" cy="214" rx="26" ry="14" fill="#e4846d" opacity=".4"/>
        <ellipse cx="264" cy="214" rx="26" ry="14" fill="#e4846d" opacity=".4"/>
        <g id="eye-l" data-cx="150" data-cy="177" transform="translate(150 177)">
