          <g id="pupil-l">
            <circle cx="0" cy="-0.5" r="10.0" fill="#5f6b3a"/>
            <circle cx="0" cy="-0.5" r="6.0" fill="#0e0807"/>
            <circle cx="-3" cy="-3.6" r="2.4" fill="#ffffff"/>
          </g>
          <path d="M -18 -1 Q 0 -24.150000000000002 18 -1" fill="none" stroke="#1a0f0a" stroke-width="4.2" stroke-linecap="round"/>
        </g>
        <g id="eye-r" data-cx="250" data-cy="177" transform="translate(250 177)">
          <ellipse rx="16" ry="11.5" fill="#f3efe8" stroke="#1a0f0a" stroke-width="3"/>
          <g id="pupil-r">
            <circle cx="0" cy="-0.5" r="10.0" fill="#5f6b3a"/>
            <circle cx="0" cy="-0.5" r="6.0" fill="#0e0807"/>
            <circle cx="-3" cy="-3.6" r="2.4" fill="#ffffff"/>
          </g>
          <path d="M -18 -1 Q 0 -24.150000000000002 18 -1" fill="none" stroke="#1a0f0a" stroke-width="4.2" stroke-linecap="round"/>
        </g>
        <path d="M 132 190 Q 150 198 168 190 M 232 190 Q 250 198 268 190" fill="none" stroke="#bd8860" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        <path id="brow-l" d="M 120 156 Q 148 138 186 148 L 184 158 Q 152 150 126 166 Z" fill="#5a3a24" stroke="#5a3a24" stroke-width="3.5" stroke-linejoin="round"/>
        <path id="brow-r" d="M 280 156 Q 252 138 214 148 L 216 158 Q 248 150 274 166 Z" fill="#5a3a24" stroke="#5a3a24" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="200" cy="214" rx="19" ry="13" fill="#e8957a" opacity=".6"/>
        <path d="M 183 222 Q 200 233 217 222" fill="none" stroke="#1a0f0a" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
        <ellipse cx="192" cy="224" rx="4.5" ry="2.8" fill="#2a130c" opacity=".5"/><ellipse cx="208" cy="224" rx="4.5" ry="2.8" fill="#2a130c" opacity=".5"/>
        <g clip-path="url(#face-clip)">
          <path d="M 98 176 C 96 246, 138 312, 200 318 C 262 312, 304 246, 302 176 C 290 208, 268 226, 244 232 C 230 226, 170 226, 156 232 C 132 226, 110 208, 98 176 Z" fill="#5a3a24" stroke="#1a0f0a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 120 220 Q 132 262 168 288 M 280 220 Q 268 262 232 288 M 150 270 Q 200 304 250 270 M 108 200 Q 112 226 124 244 M 292 200 Q 288 226 276 244" fill="none" stroke="#7e5a3a" stroke-width="4" stroke-linecap="round" opacity=".75"/>
        </g>
        <path d="M 150 240 Q 178 224 200 234 Q 222 224 250 240 Q 224 252 200 247 Q 176 252 150 240 Z" fill="#5a3a24" stroke="#1a0f0a" stroke-width="3" stroke-linejoin="round"/>
        <g id="mouth">
          <path id="mouth-lips" d="M 164 247.75 Q 200 255.75 236 247.75 Q 200 255.75 164 247.75 Z" fill="none" stroke="#b66a5e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
          <path id="mouth-cavity" d="M 164 247.75 Q 200 255.75 236 247.75 Q 200 255.75 164 247.75 Z" fill="#4a121a" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
          <g clip-path="url(#mouth-clip)">
            <rect id="mouth-teeth" x="168" y="242" width="64" height="0" fill="#f6f1e6"/>
            <ellipse id="mouth-tongue" cx="200" cy="262" rx="16" ry="0" fill="#d4566e"/>
          </g>
          <path id="mouth-line" d="M 164 247.75 Q 200 255.75 236 247.75 Q 200 255.75 164 247.75 Z" fill="none" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </g>
      <path d="M 104 130 C 110 100, 150 90, 200 90 C 250 90, 290 100, 296 130 Q 200 150 104 130 Z" fill="#000" opacity=".22" clip-path="url(#face-clip)"/>
      <path d="M 120 124 C 120 74, 156 42, 200 42 C 244 42, 280 74, 280 124 Z" fill="#566b3a" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 121 108 C 160 122, 240 122, 279 108 L 280 122 C 240 136, 160 136, 120 122 Z" fill="#3d4f2a" stroke="#1a0f0a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 82 130 C 96 112, 150 116, 200 118 C 250 116, 304 112, 318 130 C 326 144, 298 152, 200 154 C 102 152, 74 144, 82 130 Z" fill="#657f44" stroke="#1a0f0a" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 94 134 C 130 142, 270 142, 306 134" fill="none" stroke="#3d4f2a" stroke-width="2.5" stroke-dasharray="6 6" opacity=".8"/>
      <path d="M 140 62 Q 170 50 206 52 M 134 82 Q 162 72 190 74" fill="none" stroke="#7d9660" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    </g>
  </g>
</svg>
