[package]
name = "stream-control"
version = "0.2.0"
description = "Control en directo para OBS: escenas rápidas, cámaras y chat"
authors = ["MMARTID"]
edition = "2024"
license = "UNLICENSED"

[lib]
# El sufijo `_lib` evita el conflicto de nombres con el binario en Windows
# (ver https://github.com/rust-lang/cargo/issues/8519).
name = "stream_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
sha2 = "0.11.1"
base64 = "0.23.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
keyring = "4"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
argon2 = "0.6.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
if-addrs = "0.15.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
